# ==============================================================================
# N-MAT (SIH 26099) - Docker Compose Infrastructure Foundation
# Phase 1: Minimal Infrastructure Layer (PostgreSQL Service)
# Application containers (Backend, Frontend, ML) will be added in subsequent phases.
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: nmat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nmat_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nmat_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nmat-network

# Application services (FastAPI Backend, Next.js Frontend, ML Inference Engine)
# will be introduced in their respective development phases per the Constitution.

volumes:
  postgres_data:
    name: nmat_postgres_data

networks:
  nmat-network:
    name: nmat-network
    driver: bridge
